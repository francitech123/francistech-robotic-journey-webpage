<section class="sec"><h2>Learn by building</h2><p class="lead">Paths pair short lessons with real projects.</p><div class="paths">${L.map(l=>`<a class="path" href="#learn-${l.toLowerCase().replace(/[^a-z0-9]+/g,"-")}"><b>${l}</b></a>`).join("")}</div></section>
<section class="sec"><div class="cta"><div><h2>Built something?</h2><span class="lead" style="font-size:1rem">Document it and help someone build it next.</span></div><a class="btn pri" href="#login">Create an account</a></div></section></div>`},
projects(){return `<div class="wrap"><div class="sec"><h1 style="font-size:2.4rem">Projects</h1><div class="chips" id="cc"></div><div id="pg" class="grid"></div></div></div>`},
search(){return `<div class="wrap"><div class="sec"><h1 style="font-size:2.4rem">Search</h1><div class="search"><input id="q" type="search" placeholder="Try ESP32, servo, RFID, robotic arm" aria-label="Search projects"><select id="lv" aria-label="Difficulty"><option value="0">Any difficulty</option>${[1,2,3,4].map(i=>`<option value="${i}">${DL[i]}</option>`).join("")}</select></div><p class="mono" id="cnt" style="color:var(--mute)"></p><div id="sr" class="grid"></div></div></div>`},
project(id){const p=P.find(x=>x.n===id);if(!p)return nf();const u=U[p.by];
return `<div class="wrap"><div class="pd"><nav class="toc" aria-label="On this page">${["Overview","Why I built it","Components","Build","Problems","Video","Downloads","Next version","Revision history","Comments"].map(s=>`<a href="#project-${p.n}" data-s="${s}">${s}</a>`).join("")}</nav><article class="doc">
<span class="mono num">PROJECT ${p.n} · v${E(p.ver||"1.0")}</span><h1 style="font-size:clamp(2rem,5vw,3rem)">${E(p.t)}</h1><p class="lead">Built by <a href="#creator-${p.by}" style="color:var(--p);font-weight:600">${E(u.name)}</a></p><div class="tags">${p.tags.map(t=>`<span class="tag mono">${E(t)}</span>`).join("")}</div>
<div class="row" id="eng" style="margin:16px 0"></div><div class="meta"><div><span>Difficulty</span><b class="l${p.d}">${DL[p.d]}</b></div><div><span>Build time</span><b>${p.time}</b></div><div><span>Cost</span><b>${p.cost}</b></div><div><span>Status</span><b>${p.st}</b></div></div>
<section id="s0"><h2>Overview</h2><p>${E(p.about)}</p><table class="tbl mono"><tr><th>Controller</th><td>${E(p.mcu)}</td></tr><tr><th>Language</th><td>${E(p.lang)}</td></tr><tr><th>Sensors</th><td>${E(p.sens)}</td></tr><tr><th>Actuators</th><td>${E(p.act)}</td></tr><tr><th>Power</th><td>${E(p.pw)}</td></tr><tr><th>Communication</th><td>${E(p.com)}</td></tr></table></section>
<section id="s1"><h2>Why I built it</h2><p>${E(p.why)}</p></section>
<section id="s2"><h2>Components</h2><p><a class="btn sm" href="/api/projects/${p.n}/bom.csv">Download BOM (CSV)</a></p><div style="overflow-x:auto"><table class="tbl"><tr><th>Component</th><th>Qty</th><th>Specification</th></tr>${p.bom.map(r=>`<tr><td>${E(r[0])}</td><td class="mono">${r[1]}</td><td class="mono">${E(r[2])}</td></tr>`).join("")}</table></div></section>
<section id="s3"><h2>Build</h2><ol class="steps">${p.steps.map(s=>`<li><span>${E(s)}</span></li>`).join("")}</ol></section>
<section id="s4"><h2>Problems and solutions</h2><p>${E(p.prob)}</p></section>
<section id="s5"><h2>Video</h2>${p.vid?`<div class="video"><a class="btn pri" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${E(p.vid)}">Watch the build on YouTube</a></div>`:`<div class="video">No build video yet.</div>`}</section>
<section id="s6"><h2>Downloads</h2>${p.files.map(f=>`<div class="dl"><span>${E(f)}</span><button class="btn sm" data-dl>Download</button></div>`).join("")}<p class="mono msg" id="dm" style="color:var(--mute)"></p></section>
<section id="s7"><h2>Next version</h2><p>${E(p.next)}</p></section><section id="s8"><h2>Revision history</h2>${(p.hist||[{v:"1.0",note:"Initial release"}]).map(h=>`<p><b class="mono">v${E(h.v)}</b> ${E(h.note)}</p>`).join("")}</section><section id="s9"><h2>Comments</h2><div id="cm"></div></section></article></div></div>`},
creator(id){const u=U[id];if(!u)return nf();const ps=P.filter(p=>p.by===id);return `<div class="wrap"><div class="prof"><div class="av">${E(u.name[0])}</div><div><h1 style="font-size:2rem;margin:0">${E(u.name)}</h1><p class="lead" style="margin:4px 0 0">${E(u.bio)}</p><p class="mono" style="color:var(--mute);margin:6px 0 0">${ps.length} projects · ${u.fol} followers</p></div><div id="fw" style="margin-left:auto"></div></div><div class="sec"><h2>Projects</h2><div class="grid" style="margin-top:14px">${ps.map(card).join("")}</div></div></div>`},
login(){return `<div class="wrap"><div class="auth"><div class="tabs"><button class="btn sm pri" data-m="in">Sign in</button><button class="btn sm" data-m="up">Create account</button></div><div class="field" id="fn" hidden><label for="nm">Username</label><input id="nm" autocomplete="username"></div><div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email"></div><div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"></div><p class="msg" id="er" role="alert"></p><button class="btn pri" id="go" style="width:100%;justify-content:center">Sign in</button><p class="mono" style="color:var(--mute);font-size:.75rem;margin-bottom:0">Preview only. Accounts are stored in this browser until the backend is connected.</p></div></div>`}};
function nf(){return `<div class="wrap"><div class="sec"><div class="empty">That page doesn’t exist. <a href="#projects" style="color:var(--p)">Browse projects</a></div></div></div>`}
function wire(r,id){
if(r==="projects"){let c="All";const cats=["All",...new Set(P.map(p=>p.c))];const draw=()=>{$("#cc").innerHTML=cats.map(k=>`<button class="chip" aria-pressed="${k===c}" data-c="${E(k)}">${E(k)}</button>`).join("");$("#pg").innerHTML=P.filter(p=>c==="All"||p.c===c).map(card).join("");$("#cc").onclick=e=>{const b=e.target.closest("[data-c]");if(b){c=b.dataset.c;draw()}}};draw()}
if(r==="search"){const run=()=>{const q=$("#q").value.trim().toLowerCase().split(/\s+/).filter(Boolean),lv=+$("#lv").value;const res=P.filter(p=>{const h=[p.t,p.c,p.sub,p.mcu,p.sens,p.act,U[p.by].name,...p.tags].join(" ").toLowerCase();return q.every(w=>h.includes(w))&&(!lv||p.d===lv)});$("#cnt").textContent=res.length+(res.length===1?" project":" projects");$("#sr").innerHTML=res.length?res.map(card).join(""):`<div class="empty" style="grid-column:1/-1">No projects match. Remove a word or set difficulty to Any.</div>`};$("#q").oninput=run;$("#lv").onchange=run;run()}
if(r==="project"){document.querySelectorAll("[data-s]").forEach((a,i)=>a.onclick=e=>{e.preventDefault();document.getElementById("s"+i).scrollIntoView({behavior:"smooth"})});document.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>{$("#dm").textContent="Downloads start working when file storage is connected to the backend."})}
if(r==="login"){let m="in";const bs=document.querySelectorAll("[data-m]");bs.forEach(b=>b.onclick=()=>{m=b.dataset.m;bs.forEach(x=>x.classList.toggle("pri",x===b));$("#fn").hidden=m==="in";$("#go").textContent=m==="in"?"Sign in":"Create account";$("#er").textContent=""});
$("#go").onclick=()=>{const em=$("#em").value.trim(),pw=$("#pw").value,nm=$("#nm").value.trim();const er=$("#er");
if(!/^\S+@\S+\.\S+$/.test(em))return er.textContent="Enter a valid email address.";
if(pw.length<8)return er.textContent="Password must be at least 8 characters.";
if(m==="up"&&nm.length<3)return er.textContent="Choose a username with at least 3 characters.";
mem={name:m==="up"?nm:em.split("@")[0],email:em};setUser(mem);acct();location.hash="home"}}}
function route(){const h=(location.hash||"#home").slice(1);let r=h,id="";if(h.startsWith("project-")){r="project";id=h.slice(8)}else if(h.startsWith("creator-")){r="creator";id=h.slice(8)}else if(h.startsWith("edit-")){r="edit";id=h.slice(5)}else if(h.startsWith("learn-")){r="learn";id=h.slice(6)}else if(h==="admin"||h.startsWith("admin-")){r="admin";id=h.slice(6)}else if(h.startsWith("verify-")){r="verify";id=h.slice(7)}else if(h.startsWith("reset-")){r="reset";id=h.slice(6)}else if(h.startsWith("confirm-email-")){r="confirm";id=h.slice(14)}else if(h.startsWith("lesson-")){r="lesson";id=h.slice(7)}
if(!V[r]){app.innerHTML=nf();return}
app.innerHTML=V[r](id);wire(r,id);
document.querySelectorAll("#nav a").forEach(a=>{const on=a.dataset.r===r||(r==="project"&&a.dataset.r==="projects")||((r==="learn"||r==="lesson")&&a.dataset.r==="learning");on?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current")});
const t=r==="project"&&P.find(p=>p.n===id);document.title=t?t.t+" — Idevrx":"Idevrx — Ideas engineered into reality";window.scrollTo(0,0)}
const KEY="idevrx_mine",CAT=["Robotics","Electronics","AI & Computer Vision","Mechanical","Automation"],OK="zip pdf png jpg jpeg svg stl step stp f3d dwg ino py cpp c h md txt csv json mp4".split(" "),STEPS=["Information","Media","Components","Build docs","Files","Video","Preview","Publish"],BASE=P.length;
let MINE=[],W=null,step=0;try{MINE=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
const sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(MINE.map(p=>({...p,img:p.img&&p.img.length<150000?p.img:""}))))}catch(e){}};
const slug=n=>n.toLowerCase().replace(/[^a-z0-9_-]/g,"")||"creator",bump=v=>{const a=v.split(".");return a[0]+"."+(+a[1]+1)},clone=o=>JSON.parse(JSON.stringify(o)),ytId=u=>{const m=u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/))([\w-]{11})/);return m?m[1]:""};
function sync(){P.length=BASE;MINE.filter(p=>p.ps==="Published").forEach(p=>{P.push(p);if(!U[p.by])U[p.by]={name:p.by,bio:"New creator on Idevrx.",fol:0}})}
function put(p){const i=MINE.findIndex(x=>x.id===p.id);i<0?MINE.push(p):MINE[i]=p;sv();sync()}
sync();
function blank(){const u=cur(),by=slug(u.name);if(!U[by])U[by]={name:u.name,bio:"New creator on Idevrx.",fol:0};return{id:"d"+Date.now().toString(36),n:"",t:"",about:"",c:CAT[0],d:1,time:"",cost:"",st:"Completed",mcu:"",lang:"",sens:"—",act:"—",pw:"—",com:"—",tags:[],img:"",bom:[["","1",""]],why:"",steps:[],prob:"",next:"",files:[],vurl:"",vid:"",ver:"1.0",hist:[],ps:"Draft",by,note:""}}
const NAV=[["dashboard","Dashboard"],["create","Create project"],["projects","Browse projects"],["search","Search"],["following","Following"],["saved","Saved"],["notifications","Notifications"],["settings","Settings"]];
const shell=(a,h)=>`<div class="shell"><aside class="side" aria-label="App">${NAV.map(n=>`<a href="#${n[0]}"${n[0]===a?' aria-current="page"':""}>${n[1]}</a>`).join("")}<div class="who">${E((cur()||{}).name||"")}</div></aside><section class="pane">${h}</section></div>`;
const gate=m=>`<div class="wrap"><div class="auth" style="text-align:center"><p>${m}</p><a class="btn pri" href="#login">Sign in</a></div></div>`;
const cgate=()=>`<div class="wrap"><div class="auth"><h2>Creator access</h2><p>Only creators can publish projects. Registered users can browse, search and read every project.</p><button class="btn pri" id="gc">Become a creator</button><p style="color:var(--mute);font-size:.8rem;margin-bottom:0">Preview only. Access is granted instantly here.</p></div></div>`;
const guard=()=>{const u=cur();return !u?gate("Sign in to continue."):!u.creator?cgate():""};
V.dashboard=()=>{const g=guard();if(g)return g;const me=slug(cur().name),my=MINE.filter(p=>p.by===me);return shell("dashboard",`<div class="sh"><div><h1 style="font-size:2rem;margin:0">Dashboard</h1><span class="lead" style="font-size:.95rem">Your projects and drafts.</span></div><a class="btn pri" href="#create">Create project</a></div>${my.length?`<div style="overflow-x:auto"><table class="tbl"><tr><th>Project</th><th>Status</th><th>Version</th><th></th></tr>${my.map(p=>`<tr><td><b>${E(p.t||"Untitled")}</b><div class="num">${p.n?"Project "+p.n:"No number yet"}</div></td><td><span class="tag">${p.ps}</span></td><td class="mono">v${E(p.ver)}</td><td style="text-align:right;white-space:nowrap"><a class="btn sm" href="#edit-${p.id}">Edit</a> ${p.ps==="Published"?`<a class="btn sm" href="#project-${p.n}">View</a> <button class="btn sm" data-a="un" data-i="${p.id}">Unpublish</button>`:`<button class="btn sm" data-a="rm" data-i="${p.id}">Delete</button>`}</td></tr>`).join("")}</table></div>`:`<div class="empty">No projects yet. <a href="#create" style="color:var(--p)">Create your first project</a>.</div>`}`)};
V.create=()=>{const g=guard();if(g)return g;W=blank();step=0;return shell("create",`<div id="wz"></div>`)};
V.edit=id=>{const g=guard();if(g)return g;const p=MINE.find(x=>x.id===id&&x.by===slug(cur().name));if(!p)return nf();W=clone(p);W.vurl=W.vurl||(W.vid?"https://youtu.be/"+W.vid:"");step=0;return shell("create",`<div id="wz"></div>`)};
const chk=()=>[["Title",W.t.trim()],["Description",W.about.trim()],["Cover image",W.img],["Components",W.bom.some(r=>r[0].trim())],["Build instructions",W.steps.some(s=>s.trim())],["Files",W.files.length],["Category",W.c]].map(x=>[x[0],!!x[1]]);
function as(){if(W.ps==="Published")return;put(clone(W));const s=$("#sa");if(s)s.textContent="Saved"}
function pub(){if(chk().some(x=>!x[1]))return;const first=!W.n;if(first)W.n=String(Math.max(0,...P.concat(MINE).map(p=>+p.n||0))+1).padStart(3,"0");W.ver=first?"1.0":bump(W.ver);W.hist=(W.hist||[]).concat([{v:W.ver,note:W.note||(first?"Initial release":"Updated")}]);W.note="";W.slug=W.t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");["time","cost","mcu","lang"].forEach(k=>{if(!W[k].trim())W[k]="—"});W.steps=W.steps.filter(s=>s.trim());W.bom=W.bom.filter(r=>r[0].trim());W.sub=W.c;W.ps="Published";put(clone(W));location.hash="project-"+W.n}
function img(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const w=Math.min(720,i.width),c=document.createElement("canvas");c.width=w;c.height=w*i.height/i.width;c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.72))};i.onerror=()=>cb("");i.src=r.result};r.readAsDataURL(f)}
function body(){const fi=(k,l,v)=>`<div class="field"><label for="f_${k}">${l}</label><input id="f_${k}" data-k="${k}" value="${E(v!==undefined?v:W[k])}"></div>`,ta=(k,l,v,r)=>`<div class="field"><label for="f_${k}">${l}</label><textarea id="f_${k}" data-k="${k}" rows="${r||4}">${E(v!==undefined?v:W[k])}</textarea></div>`,sel=(k,l,o)=>`<div class="field"><label for="f_${k}">${l}</label><select id="f_${k}" data-k="${k}">${o.map(x=>`<option value="${E(x[0])}"${String(W[k])===String(x[0])?" selected":""}>${E(x[1])}</option>`).join("")}</select></div>`,g=(a,b)=>`<div class="g2">${a}${b}</div>`;
switch(step){
case 0:return fi("t","Title")+ta("about","Description",undefined,3)+g(sel("c","Category",CAT.map(x=>[x,x])),sel("d","Difficulty",[1,2,3,4].map(i=>[i,DL[i]])))+g(fi("time","Estimated build time"),fi("cost","Estimated cost"))+g(fi("mcu","Controller"),fi("lang","Programming language"))+g(fi("tags","Tags, comma separated",W.tags.join(", ")),sel("st","Build status",[["Completed","Completed"],["In progress","In progress"]]));
case 1:return `<div class="field"><label for="fc">Cover image</label><input id="fc" type="file" accept="image/*"></div>${W.img?`<img src="${W.img}" alt="Cover preview" style="max-width:360px;width:100%;border:1px solid var(--line);border-radius:10px"><p><button class="btn sm" id="ri">Remove image</button></p>`:`<div class="empty">Add a clear photo of the finished build.</div>`}`;
case 2:return `<div style="overflow-x:auto"><table class="tbl"><tr><th>Component</th><th>Qty</th><th>Specification</th><th></th></tr>${W.bom.map((r,i)=>`<tr>${[0,1,2].map(j=>`<td><input aria-label="${["Component","Quantity","Specification"][j]} ${i+1}" data-b="${i},${j}" value="${E(r[j])}"></td>`).join("")}<td><button class="btn sm" data-rm="${i}" aria-label="Remove row ${i+1}">Remove</button></td></tr>`).join("")}</table></div><p><button class="btn sm" id="ab">Add component</button></p>`;
case 3:return ta("why","Why you built it")+ta("steps","Build steps, one per line",W.steps.join("\n"),6)+ta("prob","Problems and solutions")+ta("next","Next version");
case 4:return `<div class="field"><label for="ff">Project files</label><input id="ff" type="file" multiple></div><p class="msg" id="fm"></p>${W.files.map((f,i)=>`<div class="dl"><span>${E(f)}</span><button class="btn sm" data-rf="${i}">Remove</button></div>`).join("")||`<div class="empty">Add source code, schematics, CAD files and a project ZIP.</div>`}<p style="color:var(--mute);font-size:.85rem">Preview: file names are recorded now. Uploads start when storage is connected.</p>`;
case 5:return fi("vurl","YouTube link",W.vurl||"")+`<p id="vm" style="color:var(--mute)">${W.vid?"Video found: "+E(W.vid):"Optional. Paste a youtube.com or youtu.be link."}</p>`;
case 6:return `<h2>Project check</h2><ul class="ck">${chk().map(x=>`<li>${x[1]?"Done":"Missing"}: ${x[0]}</li>`).join("")}</ul>`;
default:{const c=chk(),ok=c.every(x=>x[1]);return `<h2>Publish</h2><p>${ok?"Everything is in place.":"Complete these first: "+c.filter(x=>!x[1]).map(x=>x[0]).join(", ")+"."}</p>${W.n?ta("note","What changed in this version?",undefined,3):""}<p class="num">Publishing as v${W.n?bump(W.ver):"1.0"}</p><button class="btn pri" id="pb"${ok?"":" disabled"}>Publish</button>`}}}
function dw(){const el=$("#wz");if(!el)return;const pb=W.ps==="Published";el.innerHTML=`<div class="sh"><div><h1 style="font-size:2rem;margin:0">${W.n?"Edit project "+W.n:"Create project"}</h1><span class="lead" style="font-size:.95rem">${pb?"Changes go live when you publish.":"Drafts save automatically."} <span id="sa"></span></span></div>${pb?"":`<button class="btn" id="sd">Save draft</button>`}</div><div class="chips">${STEPS.map((s,i)=>`<button class="chip" data-st="${i}" aria-pressed="${i===step}">${i+1}. ${s}</button>`).join("")}</div><div>${body()}</div><div class="row" style="margin-top:22px"><button class="btn" id="bk"${step?"":" disabled"}>Back</button>${step<7?`<button class="btn pri" id="nx">Next</button>`:""}</div>`;
el.oninput=e=>{const t=e.target,k=t.dataset.k,b=t.dataset.b;if(b){const[i,j]=b.split(",");W.bom[i][j]=t.value}else if(k){let v=t.value;if(k==="tags")v=v.split(",").map(s=>s.trim()).filter(Boolean);else if(k==="steps")v=v.split("\n");else if(k==="d")v=+v;W[k]=v;if(k==="vurl"){W.vid=ytId(v);const m=$("#vm");if(m)m.textContent=W.vid?"Video found: "+W.vid:v?"That doesn’t look like a YouTube link.":"Optional. Paste a youtube.com or youtu.be link."}}else return;as()};
el.onchange=e=>{const t=e.target;if(t.id==="fc"&&t.files[0])img(t.files[0],d=>{if(d){W.img=d;as()}dw()});if(t.id==="ff"){let m="";[...t.files].forEach(f=>{const x=f.name.split(".").pop().toLowerCase();if(!OK.includes(x))m+=f.name+" was rejected: ."+x+" files aren’t allowed. ";else if(f.size>2e7)m+=f.name+" is over 20 MB. ";else W.files.push(f.name+" · "+Math.ceil(f.size/1024)+" KB")});as();dw();$("#fm").textContent=m}};
el.onclick=e=>{const b=e.target.closest("button");if(!b)return;const d=b.dataset;if(d.st!==undefined){step=+d.st;dw()}else if(b.id==="bk"){step--;dw()}else if(b.id==="nx"){step++;dw()}else if(b.id==="ab"){W.bom.push(["","1",""]);dw()}else if(d.rm!==undefined){W.bom.splice(+d.rm,1);if(!W.bom.length)W.bom.push(["","1",""]);as();dw()}else if(d.rf!==undefined){W.files.splice(+d.rf,1);as();dw()}else if(b.id==="ri"){W.img="";as();dw()}else if(b.id==="sd")as();else if(b.id==="pb")pub()}}
const w0=wire;wire=function(r,id){w0(r,id);const g=$("#gc");if(g)g.onclick=()=>{const u=cur();u.creator=true;mem=u;setUser(u);route()};if(r==="create"||r==="edit")dw();if(r==="dashboard")app.onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;const p=MINE.find(x=>x.id===b.dataset.i);if(b.dataset.a==="un"&&p)p.ps="Unpublished";else MINE=MINE.filter(x=>x.id!==b.dataset.i);sv();sync();route()}};

</script><script src="/viewers.js"></script>
<script src="/bridge.js"></script>
