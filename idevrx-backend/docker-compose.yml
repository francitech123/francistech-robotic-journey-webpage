# One command for local development: docker compose up --build
# App: http://localhost:4000   Storage console: http://localhost:9001 (minioadmin / minioadmin)
services:
  mongo:
    image: mongo:7
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025"] # inbox for local emails: http://localhost:8025

  createbucket:
    image: minio/mc
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/idevrx"
    restart: "no"

  api:
    build: .
    ports: ["4000:4000"]
    environment:
      MONGODB_URI: mongodb://mongo:27017/idevrx
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret}
      CREATOR_AUTO_APPROVE: "true"
      REQUIRE_VERIFIED_EMAIL: "true" # set to "false" to skip email verification locally
      APP_URL: http://localhost:4000
      SMTP_URL: smtp://mailpit:1025
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: idevrx
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    depends_on:
      mongo: { condition: service_healthy }
      createbucket: { condition: service_completed_successfully }
      mailpit: { condition: service_started }

volumes:
  mongo-data:
  minio-data:
